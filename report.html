<!DOCTYPE html>
<html>
<head>
  <title>Report an Issue</title>
 <style>
  body { font-family: Arial, sans-serif; background: #f8fafc; max-width: 500px; margin: 30px auto; padding: 0 20px; color: #0f172a; }
  h1 { font-size: 24px; margin-bottom: 20px; }
  #categoryButtons, #treeSubtypes, #waterSubtypes { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  button { padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 8px; background: white; cursor: pointer; font-size: 14px; transition: all 0.15s ease; }
  button:hover { background: #f1f5f9; }
  button.selected {
    background: #166534 !important;
    color: white !important;
    border-color: #166534 !important;
  }
  input[type="file"], input[type="text"], textarea { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; box-sizing: border-box; }
  #submitSection button { background: #166534; color: white; width: 100%; padding: 14px; font-weight: bold; }
  #submitSection button.selected { background: #166534; } /* keep submit button unaffected by generic selected style */
  #locationStatus { font-size: 13px; color: #475569; margin-bottom: 12px; }
</style>
</head>
<body>

  <h1>Report an Environmental Issue</h1>

  <div id="categoryButtons">
    <button type="button" onclick="selectCategory('tree')">Tree</button>
    <button type="button" onclick="selectCategory('water')">Water Body</button>
  </div>

  <div id="subtypeButtons" style="display: none;">
    <div id="treeSubtypes" style="display: none;">
      <button type="button" onclick="selectSubtype('cut')">Cut Down</button>
      <button type="button" onclick="selectSubtype('planted')">Planted</button>
    </div>

    <div id="waterSubtypes" style="display: none;">
      <button type="button" onclick="selectSubtype('foam')">Foam</button>
      <button type="button" onclick="selectSubtype('algae')">Algae Bloom</button>
      <button type="button" onclick="selectSubtype('trash')">Trash</button>
      <button type="button" onclick="selectSubtype('dead_fish')">Dead Fish</button>
      <button type="button" onclick="selectSubtype('odor')">Bad Odor</button>
    </div>
  </div>

  <div id="photoSection">
  <input type="file" accept="image/*" capture="environment" id="photoInput">
</div>
<div id="locationStatus"></div>

<div id="locationNameSection">
  <input type="text" id="locationNameInput" placeholder="Location name (e.g. Bellandur Lake)">
</div>

<div id="noteSection">
  <textarea id="noteInput" placeholder="Optional note..." rows="3" cols="30"></textarea>
</div>

<div id="submitSection">
  <button type="button" onclick="submitReport()">Submit Report</button>
</div>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBGNvaYpodDmSyXIVtB_rjsGCnZxDnA5ns",
      authDomain: "ecosanskriti-25254.firebaseapp.com",
      projectId: "ecosanskriti-25254",
      storageBucket: "ecosanskriti-25254.firebasestorage.app",
      messagingSenderId: "664388803197",
      appId: "1:664388803197:web:162e42d89bc2b1d59f2f14"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <script>
    let selectedCategory = null;
    let selectedSubtype = null;
    let capturedPhoto = null;
    let capturedLat = null;
    let capturedLng = null;

    function selectCategory(category) {
  selectedCategory = category;
  console.log("Category selected:", selectedCategory);

  document.querySelectorAll('#categoryButtons button').forEach(btn => btn.classList.remove('selected'));
  event.target.classList.add('selected');

  document.getElementById('subtypeButtons').style.display = 'block';

  if (category === 'tree') {
    document.getElementById('treeSubtypes').style.display = 'block';
    document.getElementById('waterSubtypes').style.display = 'none';
  } else {
    document.getElementById('treeSubtypes').style.display = 'none';
    document.getElementById('waterSubtypes').style.display = 'block';
  }
}
   function selectSubtype(subtype) {
  selectedSubtype = subtype;
  console.log("Subtype selected:", selectedSubtype);

  document.querySelectorAll('#subtypeButtons button').forEach(btn => btn.classList.remove('selected'));
  event.target.classList.add('selected');
}

    function getLocation() {
      document.getElementById('locationStatus').textContent = "Getting your location...";
      navigator.geolocation.getCurrentPosition(
        function(position) {
          capturedLat = position.coords.latitude;
          capturedLng = position.coords.longitude;
          console.log("Location captured:", capturedLat, capturedLng);
          document.getElementById('locationStatus').textContent = "Location captured ✓";
        },
        function(error) {
          console.log("Location error:", error.message);
          document.getElementById('locationStatus').textContent = "";
          alert("Location access is needed to submit a report.");
        }
      );
    }

    document.getElementById('photoInput').addEventListener('change', function(event) {
      capturedPhoto = event.target.files[0];
      console.log("Photo captured:", capturedPhoto);
      getLocation();
    });

    function submitReport() {
      if (!selectedCategory) {
        alert("Please select a category (Tree or Water Body).");
        return;
      }
      if (!selectedSubtype) {
        alert("Please select a subtype.");
        return;
      }
      if (!capturedPhoto) {
        alert("Please take a photo.");
        return;
      }
      if (capturedLat === null || capturedLng === null) {
        alert("Location not captured yet. Please try taking the photo again.");
        return;
      }

      const report = {
        category: selectedCategory,
        subtype: selectedSubtype,
        lat: capturedLat,
        lng: capturedLng,
        timestamp: new Date().toISOString(),
        note: document.getElementById('noteInput').value,
        locationName: document.getElementById('locationNameInput').value
      };

      db.collection("reports").add(report)
        .then(() => {
          console.log("Report saved to Firebase:", report);
          alert("Report submitted successfully!");
        })
        .catch((error) => {
          console.error("Error saving report:", error);
          alert("Something went wrong submitting your report. Check the console.");
        });
    }
  </script>

</body>
</html>
