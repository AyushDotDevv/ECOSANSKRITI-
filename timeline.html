<!DOCTYPE html>
<html>
<head>
  <title>Report Timeline</title>
  <style>
    :root {
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-border: #e2e8f0;
      --color-text: #0f172a;
      --color-text-muted: #475569;
      --color-tree: #166534;
      --color-tree-bg: #dcfce7;
      --color-water: #0284c7;
      --color-water-bg: #e0f2fe;
      --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-system);
      background: var(--color-bg);
      color: var(--color-text);
      max-width: 560px;
      margin: 30px auto;
      padding: 0 20px 60px;
    }
    .back-link { display: inline-block; margin-bottom: 20px; color: var(--color-text-muted); text-decoration: none; font-size: 14px; }
    .back-link:hover { color: var(--color-text); }

    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    .page-sub { color: var(--color-text-muted); font-size: 14px; margin-bottom: 24px; }

    label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
    input[type="text"] {
      padding: 12px 14px;
      width: 100%;
      margin-bottom: 24px;
      box-sizing: border-box;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: var(--color-surface);
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    }
    input[type="text"]:focus { outline: none; border-color: var(--color-tree); }

    .timeline-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(15,23,42,0.06);
    }
    .date {
      font-weight: 700;
      display: inline-block;
      font-size: 13px;
      color: var(--color-text-muted);
      margin-bottom: 6px;
    }
    .category {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }
    .category.tree { background: var(--color-tree-bg); color: var(--color-tree); }
    .category.water { background: var(--color-water-bg); color: var(--color-water); }

    .timeline-card p { font-size: 14px; margin-top: 8px; color: var(--color-text); }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--color-text-muted);
      font-size: 14px;
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <a href="index.html" class="back-link">← Back to Home</a>

  <h1>Report Timeline</h1>
  <p class="page-sub">Search a location to see its reported history over time.</p>

  <label for="locationPicker">Location</label>
  <input type="text" id="locationPicker" list="locationSuggestions" placeholder="e.g. Bellandur Lake">
  <datalist id="locationSuggestions"></datalist>

  <div id="timeline"></div>

  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBGNvaYpodDmSyXIVtB_rjsGCnZxDnA5ns",
      authDomain: "ecosanskriti-25254.firebaseapp.com",
      projectId: "ecosanskriti-25254",
      storageBucket: "ecosanskriti-25254.firebasestorage.app",
      messagingSenderId: "664388803197",
      appId: "1:664388803197:web:162e42d89bc2b1d59f2f14"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <script>
    let allReports = [];

    function populateLocationPicker(reports) {
      const uniqueLocations = [...new Set(reports.map(r => r.locationName).filter(name => name))];
      const list = document.getElementById('locationSuggestions');

      uniqueLocations.forEach(location => {
        const option = document.createElement('option');
        option.value = location;
        list.appendChild(option);
      });
    }

    function getReportsForLocation(reports, locationName) {
      return reports.filter(r => r.locationName === locationName);
    }

    function sortByDate(reports) {
      return reports.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
    }

    function renderTimeline(reports) {
      const container = document.getElementById('timeline');

      if (reports.length === 0) {
        container.innerHTML = "<div class='empty-state'>No reports yet for this location.</div>";
        return;
      }

      container.innerHTML = reports.map(r => `
        <div class="timeline-card">
          <span class="date">${new Date(r.timestamp).toLocaleDateString()}</span>
          <span class="category ${r.category}">${r.subtype}</span>
          <p>${r.note || ''}</p>
        </div>
      `).join('');
    }

    db.collection("reports").get().then((snapshot) => {
      allReports = snapshot.docs.map(doc => doc.data());
      console.log("Loaded reports from Firebase:", allReports);
      populateLocationPicker(allReports);
    }).catch((error) => {
      console.error("Error loading reports:", error);
    });

    document.getElementById('locationPicker').addEventListener('input', function(event) {
      const selectedLocation = event.target.value;

      if (selectedLocation === "") {
        document.getElementById('timeline').innerHTML = "";
        return;
      }

      const filtered = getReportsForLocation(allReports, selectedLocation);
      const sorted = sortByDate(filtered);
      renderTimeline(sorted);
    });
  </script>

</body>
</html>
